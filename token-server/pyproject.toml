[project]
name = "dalab-token-server"
version = "0.1.0"
description = "FastAPI token endpoint for the DaLab AI LiveKit voice widget"
requires-python = ">=3.10"
dependencies = [
    "livekit-api~=1.0",
    "fastapi[standard]~=0.115",
    "uvicorn[standard]~=0.34",
    "python-dotenv~=1.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.uv]
package = false
